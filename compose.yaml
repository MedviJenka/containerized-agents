name: omp-agent-team

x-agent-environment: &agent-environment
  PROJECT_DIRECTORY: /project
  SHARED_DIRECTORY: /shared
  WORKSPACE_DIRECTORY: /work/current
  OMP_STATE_DIRECTORY: /home/agent/.omp
  OMP_TASK_TIMEOUT_SECONDS: ${OMP_TASK_TIMEOUT_SECONDS:-1800}
  LOGFIRE_WRITE_TOKEN: ${LOGFIRE_WRITE_TOKEN:?LOGFIRE_WRITE_TOKEN must be set}

x-agent: &agent
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BUN_VERSION: ${BUN_VERSION:-1.3.14}
      PYTHON_VERSION: ${PYTHON_VERSION:-3.13-slim}
      OMP_VERSION: ${OMP_VERSION:-18.6.0}
  image: omp-agent-runtime:local
  init: true
  restart: unless-stopped
  expose:
    - "8000"
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s

services:
  team_1:
    <<: *agent
    environment:
      <<: *agent-environment
      AGENT_STAGE: team_1
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets:
      - openai_api_key
    command:
      - uvicorn
      - agent_service.worker_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - .:/project:ro
      - shared:/shared
      - team_1_state:/home/agent/.omp
      - team_1_work:/work

  team_2:
    <<: *agent
    environment:
      <<: *agent-environment
      AGENT_STAGE: team_2
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets:
      - openai_api_key
    command:
      - uvicorn
      - agent_service.worker_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - .:/project:ro
      - shared:/shared
      - team_2_state:/home/agent/.omp
      - team_2_work:/work

  coordinator:
    <<: *agent
    environment:
      PROJECT_DIRECTORY: /project
      SHARED_DIRECTORY: /shared
      OMP_TASK_TIMEOUT_SECONDS: ${OMP_TASK_TIMEOUT_SECONDS:-1800}
      LOGFIRE_WRITE_TOKEN: ${LOGFIRE_WRITE_TOKEN:?LOGFIRE_WRITE_TOKEN must be set}
      TEAM_1_URL: http://team_1:8000
      TEAM_2_URL: http://team_2:8000
    command:
      - uvicorn
      - agent_service.coordinator_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      team_1:
        condition: service_healthy
      team_2:
        condition: service_healthy
    ports:
      - "${COORDINATOR_PORT:-5555}:8000"
    volumes:
      - .:/project
      - shared:/shared

secrets:
  openai_api_key:
    environment: OPENAI_API_KEY

volumes:
  shared:
  team_1_state:
  team_1_work:
  team_2_state:
  team_2_work: